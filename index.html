<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tarjeta de Contacto</title>
    <style>
        :root {
            --gold:         #c9a84c;
            --gold-light:   #e8cb7a;
            --gold-dim:     rgba(201,168,76,0.18);
            --gold-border:  rgba(201,168,76,0.28);
            --white:        #ffffff;
            --white-soft:   rgba(255,255,255,0.75);
            --white-dim:    rgba(255,255,255,0.35);
            --white-faint:  rgba(255,255,255,0.07);
            --black:        #000000;
            --black-rich:   #0a0a0a;
            --black-card:   #111111;
            --black-item:   #1a1a1a;
            --card-radius:  20px;
            --item-radius:  12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        body {
            min-height:100%; width:100%;
            font-family:'Segoe UI', Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: var(--black);
            display:flex; align-items:center; justify-content:center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }
        .container { width:100%; max-width:420px; margin:auto; }

        /* ── CARD ── */
        .wallet-card {
            background: var(--black-card);
            border: 1px solid var(--gold-border);
            border-radius: var(--card-radius);
            padding: 28px 24px 24px;
            color: var(--white);
            box-shadow: 0 0 0 1px rgba(201,168,76,0.08), 0 24px 64px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.06);
            position:relative; overflow:hidden;
            animation: slideUp 0.55s ease-out;
        }
        .wallet-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .card-content { position:relative; z-index:1; }

        /* ── HEADER ── */
        .card-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:20px; padding-bottom:16px;
            border-bottom: 1px solid var(--gold-border);
        }
        .logo-aph {
            display:flex; flex-direction:column; align-items:flex-start; gap:3px;
        }
        .logo-aph-img {
            width:64px; height:auto;
            border-radius: 8px;
            background: #fff;
            padding: 3px;
        }
        .logo-aph-sub {
            font-size:8px; letter-spacing:2.5px; text-transform:uppercase;
            color: var(--gold); font-weight:600; padding-left:2px;
        }
        .card-badge {
            font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
            color: var(--gold); font-weight:700;
            background: var(--gold-dim);
            padding:6px 11px; border-radius:8px;
            border: 1px solid var(--gold-border);
        }

        /* ── FOTO PERFIL ── */
        .profile-section {
            display:flex; flex-direction:column; align-items:center;
            margin-bottom:18px;
        }
        .profile-photo-wrapper {
            position:relative; width:92px; height:92px; margin-bottom:14px;
        }
        .profile-photo {
            width:92px; height:92px; border-radius:50%;
            object-fit:cover; object-position:center top;
            border: 2px solid var(--gold);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.12), 0 8px 24px rgba(0,0,0,0.7);
        }
        .profile-photo-ring {
            position:absolute; inset:-5px; border-radius:50%;
            border: 1px solid rgba(201,168,76,0.2);
            pointer-events:none;
        }
        .name { font-size:22px; font-weight:700; color:var(--white); text-align:center; letter-spacing:0.3px; }
        .title { font-size:12px; color:var(--gold); font-weight:600; letter-spacing:1px; text-align:center; margin-top:4px; text-transform:uppercase; }
        .company { font-size:11px; color:var(--white-dim); margin-top:3px; text-align:center; }

        /* ── QR ── */
        .qr-section {
            text-align:center; margin-bottom:18px; padding:16px;
            background: rgba(255,255,255,0.97);
            border-radius: var(--item-radius);
            display:flex; flex-direction:column; align-items:center;
        }
        .qr-image { width:140px; height:140px; margin:0 auto 8px; }
        .qr-image img { width:100%; height:100%; object-fit:contain; }
        .qr-label { font-size:8px; letter-spacing:1.8px; text-transform:uppercase; color:rgba(0,0,0,0.4); font-weight:600; }

        /* ── DETALLES ── */
        .card-details { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
        .detail-item {
            background: var(--black-item);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--item-radius); padding:12px;
            transition: border-color 0.2s;
        }
        .detail-item:active { border-color: var(--gold-border); }
        .detail-label {
            font-size:8px; letter-spacing:1.4px; text-transform:uppercase;
            color: var(--gold); margin-bottom:5px; font-weight:700;
        }
        .detail-value { font-size:12px; font-weight:600; color:var(--white); }
        .detail-value a { color:var(--white-soft); text-decoration:none; }

        /* ── PORTFOLIO ── */
        .btn-portfolio {
            display:flex; align-items:center; justify-content:center; gap:10px;
            width:100%; padding:14px; border-radius: var(--item-radius);
            background: var(--black-item);
            border: 1px solid var(--gold-border);
            color: var(--gold); font-size:13px; font-weight:700;
            text-decoration:none; letter-spacing:0.5px;
            transition: background 0.2s, box-shadow 0.2s;
            margin-bottom:18px;
        }
        .btn-portfolio:active { background:#1e1e1e; box-shadow: 0 0 16px rgba(201,168,76,0.2); }

        /* ── DIVISOR ── */
        .divider {
            height:1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
            margin: 16px 0;
        }

        /* ── REDES SOCIALES ── */
        .social-icons { display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
        .social-icon {
            width:40px; height:40px; border-radius:50%;
            background: var(--black-item);
            display:flex; align-items:center; justify-content:center;
            font-size:13px; font-weight:800; text-decoration:none;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--white-soft);
            transition: border-color 0.2s, color 0.2s;
        }
        .social-icon:active { border-color: var(--gold); color: var(--gold); }

        /* ── BOTONES ── */
        .action-buttons { display:flex; gap:10px; margin-top:16px; }
        .btn {
            flex:1; padding:14px; border:none; border-radius: var(--item-radius);
            font-size:13px; font-weight:700; cursor:pointer;
            display:flex; align-items:center; justify-content:center; gap:7px;
            letter-spacing:0.3px;
        }
        .btn-primary {
            background: var(--gold);
            color: var(--black);
            box-shadow: 0 6px 20px rgba(201,168,76,0.3);
        }
        .btn-primary:active { transform:scale(0.97); }
        .btn-secondary {
            background: var(--white-faint);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.14);
        }
        .btn-secondary:active { background: rgba(255,255,255,0.12); }

        /* ── FOOTER ── */
        .card-footer {
            display:flex; justify-content:space-between; padding-top:12px; margin-top:12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size:9px; color:var(--white-dim); letter-spacing:0.5px;
        }

        .loading { text-align:center; color:rgba(255,255,255,0.4); padding:40px; }
        .error { color:#ff6b6b; text-align:center; padding:40px; line-height:1.6; }
        .error code { background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; font-size:12px; }
    </style>
    <script src="datos.js"></script>
</head>

        function mostrarTarjeta() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('card').style.display = 'block';

            document.getElementById('foto-perfil').src = FOTO_B64
                ? 'data:image/jpeg;base64,' + FOTO_B64
                : '';

            document.getElementById('empresa-nombre').textContent = datos.empresa || '';
            document.getElementById('nombre-display').textContent  = datos.nombre  || 'Sin nombre';
            document.getElementById('puesto-display').textContent  = datos.puesto  || '';
            document.getElementById('empresa-display').textContent = datos.empresa || '';
            document.getElementById('empresa-footer').textContent  = datos.empresa || '';

            // Detalles de contacto
            const detalles = document.getElementById('card-details');
            detalles.innerHTML = '';
            if (datos.telefonoCompleto) detalles.appendChild(crearDetalleItem('Teléfono', datos.telefonoMostrado || datos.telefonoCompleto, `tel:${datos.telefonoCompleto}`));
            if (datos.email)            detalles.appendChild(crearDetalleItem('Email', datos.email.length > 18 ? datos.email.substring(0,15)+'…' : datos.email, `mailto:${datos.email}`));
            if (datos.web)              detalles.appendChild(crearDetalleItem('Web', datos.web.replace(/^https?:\/\//,'').substring(0,20), datos.web));
            if (datos.ubicacion)        detalles.appendChild(crearDetalleItem('Ubicación', datos.ubicacion));

            // Portfolio — enlace único
            const btnPortfolio = document.getElementById('btn-portfolio');
            if (datos.portfolioUrl) {
                btnPortfolio.href = datos.portfolioUrl;
                btnPortfolio.style.display = 'flex';
            }

            // Redes sociales
            const socialContainer = document.getElementById('social-icons');
            socialContainer.innerHTML = '';
            const redes = datos.redes || {};
            const socials = [
                { key:'linkedin',  href: u => u.startsWith('http') ? u : 'https://'+u, label:'in',   title:'LinkedIn' },
                { key:'github',    href: u => u,                                         label:'⚙',    title:'GitHub' },
                { key:'instagram', href: u => `https://instagram.com/${u.replace('@','')}`, label:'📷', title:'Instagram' },
            ];
            socials.forEach(s => {
                const val = redes[s.key];
                if (!val) return;
                const a = document.createElement('a');
                a.href = s.href(val); a.target = '_blank';
                a.className = 'social-icon'; a.innerHTML = s.label; a.title = s.title;
                socialContainer.appendChild(a);
            });
        }

        function crearDetalleItem(label, valor, href) {
            const div = document.createElement('div'); div.className = 'detail-item';
            const l = document.createElement('div'); l.className = 'detail-label'; l.textContent = label;
            const v = document.createElement('div'); v.className = 'detail-value';
            if (href) {
                const a = document.createElement('a'); a.href = href; a.textContent = valor;
                if (href.startsWith('http')) a.target = '_blank';
                v.appendChild(a);
            } else { v.textContent = valor; }
            div.appendChild(l); div.appendChild(v);
            return div;
        }

        function generarVCard() {
            const redes = datos.redes || {};
            const partes = (datos.nombre || '').split(' ');
            const apellido = partes.slice(1).join(' '); const primero = partes[0];
            let v = `BEGIN:VCARD\r\nVERSION:3.0\r\nFN:${datos.nombre||''}\r\nN:${apellido};${primero};;;\r\n`;
            if (datos.telefonoCompleto) v += `TEL;TYPE=CELL:${datos.telefonoCompleto}\r\n`;
            if (datos.email)           v += `EMAIL;TYPE=INTERNET:${datos.email}\r\n`;
            if (datos.empresa)         v += `ORG:${datos.empresa}\r\n`;
            if (datos.puesto)          v += `TITLE:${datos.puesto}\r\n`;
            if (datos.web)             v += `URL;TYPE=WORK:${datos.web}\r\n`;
            if (redes.linkedin)        v += `URL;TYPE=PROFILE:${redes.linkedin}\r\n`;
            if (redes.github)          v += `URL;TYPE=PROFILE:${redes.github}\r\n`;
            if (datos.descripcion)     v += `NOTE:${datos.descripcion}\r\n`;
            v += `REV:${new Date().toISOString().split('T')[0]}\r\nEND:VCARD`;
            return v;
        }

        function generarQR() {
            const url = `https://api.qrserver.com/v1/create-qr-code/?size=148x148&color=000000&bgcolor=FFFFFF&data=${encodeURIComponent(generarVCard())}`;
            const img = document.createElement('img'); img.src = url; img.alt = 'QR';
            img.style.width = '100%'; img.style.height = 'auto';
            const c = document.getElementById('qr-image'); c.innerHTML = ''; c.appendChild(img);
        }

        function descargarVCard() {
            const blob = new Blob([generarVCard()], { type:'text/vcard;charset=utf-8' });
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = `${(datos.nombre||'contacto').replace(/\s/g,'_')}.vcf`;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function compartir() {
            if (navigator.share) {
                navigator.share({ title: datos.nombre||'Tarjeta de contacto', text: [datos.puesto,datos.empresa].filter(Boolean).join(' — '), url: window.location.href }).catch(()=>{});
            } else {
                navigator.clipboard.writeText(window.location.href).then(()=>alert('Enlace copiado'));
            }
        }

        window.addEventListener('load', function() {
            if (typeof datos === 'undefined') {
                document.getElementById('loading').innerHTML = '<div class="error">Error: no se encontró <code>datos.js</code></div>'; return;
            }
            if (!datos.nombre) {
                document.getElementById('loading').innerHTML = '<div class="error">Falta el campo <code>nombre</code> en <code>datos.js</code></div>'; return;
            }
            mostrarTarjeta();
            generarQR();
        });
    </script>
</body>
</html>
